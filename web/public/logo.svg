<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle glow -->
  <rect width="512" height="512" rx="128" fill="#0B0F17"/>
  <circle cx="200" cy="220" r="120" fill="#8B5CF6" opacity="0.15" filter="url(#glow)"/>
  <circle cx="312" cy="290" r="120" fill="#06B6D4" opacity="0.15" filter="url(#glow)"/>

  <!-- Left node (Dual) -->
  <circle cx="200" cy="220" r="70" fill="url(#primaryGrad)"/>
  <circle cx="200" cy="180" r="28" fill="#FFFFFF"/>
  <path d="M150 250 C150 220, 250 220, 250 250 C250 265, 150 265, 150 250 Z" fill="#FFFFFF" opacity="0.9"/>

  <!-- Right node (Meet) -->
  <circle cx="312" cy="290" r="70" fill="url(#accentGrad)"/>
  <circle cx="312" cy="250" r="28" fill="#FFFFFF"/>
  <path d="M262 320 C262 290, 362 290, 362 320 C362 335, 262 335, 262 320 Z" fill="#FFFFFF" opacity="0.9"/>

  <!-- Intersecting Connection Arc -->
  <path d="M200 220 Q256 256 312 290" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 16" fill="none" opacity="0.8"/>
</svg>
